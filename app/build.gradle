plugins {
    id 'com.android.application'
}

android {
    namespace 'khashaba.family.tree'
    compileSdk 35

    defaultConfig {
        applicationId "khashaba.family.tree"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    // بيانات التوقيع تُقرأ من متغيرات البيئة (مضبوطة فى GitHub Secrets عند
    // البناء عبر Actions)، فلا يتم تخزين أي كلمات سر داخل الكود نفسه.
    // لو اشتغلت محليًا بدون هذه المتغيرات، توقيع الإصدار (release) هيتجاهل
    // نفسه تلقائيًا ويرجع لتوقيع debug العادي (مفيد للتجربة المحلية فقط،
    // لكن الناتج وقتها مش صالح للرفع على Google Play).
    def keystorePropertiesFile = System.getenv("KEYSTORE_FILE")
    def hasSigningEnv = keystorePropertiesFile != null &&
                        System.getenv("KEYSTORE_PASSWORD") != null &&
                        System.getenv("KEY_ALIAS") != null &&
                        System.getenv("KEY_PASSWORD") != null

    if (hasSigningEnv) {
        signingConfigs {
            release {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigningEnv) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // مسارات مبسّطة داخل app/ (بدون app/src/main/...) لكن ضمن موديول
    // فرعى قياسى (app/) — وهذا الإعداد شائع الاستخدام وموثّق رسميًا،
    // بعكس محاولة تطبيق البلجن على المشروع الجذر مباشرة (التى تسببت
    // فى خطأ implicit dependency فى المحاولة السابقة).
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}

dependencies {
    // مطلوبة لـ FileProvider (مشاركة الكتاب مشاركة أصلية عبر أندرويد)
    implementation 'androidx.core:core:1.12.0'
}
