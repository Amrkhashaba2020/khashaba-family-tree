plugins {
    id 'com.android.application' version '8.2.0'
}

android {
    namespace 'com.khashbah.familytree'
    compileSdk 34

    defaultConfig {
        applicationId "com.khashbah.familytree"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // مشروع بملف واحد للموديول (بدون مجلد app/ منفصل) — الجذر نفسه هو التطبيق.
    // الواجهة (WebView) تُبنى بالكود مباشرة، ومجلد res/ يحتوي فقط على
    // أيقونة التطبيق المخصصة (بدقة واحدة تكفي كل الأجهزة).
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
